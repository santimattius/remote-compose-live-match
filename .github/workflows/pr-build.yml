---
name: PR Build

"on":
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: pr-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gradle:
    name: Gradle verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out pull request
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Verify project
        run: >-
          ./gradlew test
          :app-android:assembleDebug
          :app-android:assembleDebugAndroidTest
          :creator-jvm:checkDiagnosticFixture
          :creator-jvm:checkScheduledFixture
          :creator-jvm:checkLiveFixture
          :creator-jvm:checkFinishedFixture
          --no-daemon
          --stacktrace
