name: Feature request
description: Propose a reviewable product or engineering capability.
title: "[Feature]: "
labels:
  - type:feature
body:
  - type: markdown
    attributes:
      value: |
        Thank you for proposing a feature. Complete every required field
        with repository-specific evidence.
  - type: input
    id: summary
    attributes:
      label: Feature summary
      description: Describe the capability in one concise sentence.
      placeholder: Add signed Remote UI envelope validation before rendering.
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Problem and motivation
      description: Explain the user or engineering problem and why it matters.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Proposed scope
      description: State what is included and explicitly excluded.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable outcomes that determine completion.
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: Risk level
      description: Select the highest applicable implementation risk.
      options:
        - Low
        - Medium
        - High
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Submission checklist
      options:
        - label: I searched open and closed issues for duplicates.
          required: true
        - label: >-
            I included concrete acceptance criteria and out-of-scope
            boundaries.
          required: true
